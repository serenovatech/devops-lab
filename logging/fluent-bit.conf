# Collects your real app's logs from the VM's journal and nginx's access logs, and sends them to Loki.
# The DB files remember what's already been sent, so a restart doesn't send lines twice.
[SERVICE]
    Flush     1
    Log_Level info

# Starts from the journal's history, because your app writes few lines.
[INPUT]
    Name           systemd
    Tag            serenova
    Path           /var/log/journal
    Systemd_Filter _SYSTEMD_UNIT=serenova.service
    Read_From_Tail Off
    DB             /var/lib/fluent-bit/journal.db

# The wildcard also covers access.log.1, because nginx keeps writing there
# if it misses the signal to switch files after a log rotation.
[INPUT]
    Name             tail
    Tag              nginx
    Path             /var/log/nginx/access.log*
    Exclude_Path     *.gz
    Refresh_Interval 5
    DB               /var/lib/fluent-bit/nginx.db

# Keeps only the log text from the journal's many fields.
[FILTER]
    Name           record_modifier
    Match          serenova
    Allowlist_key  MESSAGE

[OUTPUT]
    Name            loki
    Match           serenova
    Host            127.0.0.1
    Port            3100
    Labels          job=serenova
    Drop_Single_Key raw

[OUTPUT]
    Name            loki
    Match           nginx
    Host            127.0.0.1
    Port            3100
    Labels          job=nginx
    Drop_Single_Key raw
