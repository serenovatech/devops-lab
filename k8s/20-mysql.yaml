# This lab's own database. Its data lives on a volume, so it survives the pod being replaced.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: poultry-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: poultry-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ['--innodb-buffer-pool-size=128M']
          env:
            - name: MYSQL_DATABASE
              value: poultry_lab
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: poultry-secrets, key: DB_PASSWORD }
          ports:
            - containerPort: 3306
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            exec:
              command: ['sh', '-c', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: poultry-lab
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
