route:
  receiver: alert-log
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: alert-log
    webhook_configs:
      - url: http://127.0.0.1:5001/
        send_resolved: true

    # Optional, lab 9: send alerts to Slack as well. Mount the webhook file in compose.yaml first.
